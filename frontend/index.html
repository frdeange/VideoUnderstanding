<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Video Descriptor Generator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Video Descriptor Generator</h1>
    <p>Upload a short video (≤40 MB). Choose the language and the app will describe what happens in the video, in sync with the scenes.</p>
    <form id="uploadForm" autocomplete="off">
      <label class="upload-area" id="uploadArea">
        <span class="upload-icon">📹</span><br>
        <span id="uploadText">Drag your video here or click to select</span>
        <input type="file" name="file" id="fileInput" accept="video/*" required />
        <div class="filename" id="filename"></div>
        <video id="videoPreview" style="display:none; margin-top:12px; max-width:100%; border-radius:8px; background:#000;" controls muted></video>
      </label>
      <div class="lang-select">
        <label for="lang">Description language:</label>
        <select id="lang" name="lang">
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="lang-select">
        <label for="tts_voice">Narration voice:</label>
        <select id="tts_voice" name="tts_voice">
          <option value="ballad">Male 1 (Ballad)</option>
          <option value="ash">Male 2 (Ash)</option>
          <option value="alloy">Female 1 (Alloy)</option>
          <option value="sage">Female 2 (Sage)</option>
        </select>
      </div>
      <button type="submit" id="submitBtn" disabled>Analyze video</button>
      <!-- <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div> -->
      <div class="step-progress-bar" id="stepProgressBar" style="display: none;">
        <div class="step" id="step-upload">Upload Video</div>
        <div class="step" id="step-extract">Extract Frames</div>
        <div class="step" id="step-analyze">Analyze Frames</div>
        <div class="step" id="step-tts">Generate Audio</div>
        <div class="step" id="step-assemble">Assemble Video</div>
      </div>
    </form>
  </div>
  <div id="result"></div>
  <footer>
    created by <a href="https://www.linkedin.com/in/fdangel/" target="_blank" rel="noopener">Kiko de Ángel</a>
  </footer>
  <script src="scripts.js"></script>
</body>
</html>
